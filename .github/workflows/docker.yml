name: Docker Build & Push

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version
        id: version
        run: |
          BASE=$(cat version.txt | tr -d '[:space:]')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${BASE}-pre.${GITHUB_RUN_NUMBER}"
          fi
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          BUILT_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "built_at=$BUILT_AT" >> $GITHUB_OUTPUT
          # The Dockerfile takes them: the server's version and /app/VERSION.
          {
            echo "build_args<<EOF"
            echo "VERSION=$VERSION"
            echo "GIT_SHA=$SHORT_SHA"
            echo "BUILT_AT=$BUILT_AT"
            echo "EOF"
          } >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION (sha=$SHORT_SHA built_at=$BUILT_AT)"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/symphonic-navigator/komogentic
          # `latest` moves ONLY on a v*.*.* tag push, never on a plain master
          # push — Komodo follows :latest, so a release is a conscious tag,
          # not every merge. A master push still builds + pushes a sha-/branch-
          # tagged image to keep the build green, but leaves the live server alone.
          # A pre-release tag (v0.2.5-pre.1: anything with a '-') gets its own
          # tag only, so a server can be pinned to it while :latest stays put.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.version.outputs.build_args }}
          cache-from: type=gha,scope=komogentic
          cache-to: type=gha,mode=max,scope=komogentic

      - name: Sign the published Docker image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

      - name: Build summary
        if: always()
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          EVENT_NAME: ${{ github.event_name }}
          IMAGE: ghcr.io/symphonic-navigator/komogentic
        run: |
          echo "## Docker Build Report: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$TAGS" ] && [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Pushed tags:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$TAGS" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_Built but not pushed (PR build)._" >> "$GITHUB_STEP_SUMMARY"
          fi
